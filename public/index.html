}
function renderCelebra(){let a=achievements(),flowers=Math.floor(a.length/2),plants=a.length;return `<div class="card"><h2>🎉 Celebrá</h2><div class="garden"><div class="row"><div><b>Tu jardín sigue creciendo 🌱</b><p class="muted">Tus pequeños avances también cuentan. ¡Hay nuevos hitos para celebrar!</p></div>${btn('Ver jardín','showGarden()','small')}</div><div class="garden-art">${'🌱'.repeat(Math.min(4,Math.max(1,plants)))} ${'🌼'.repeat(Math.min(3,flowers))}</div><div class="muted" style="text-align:center">${plants} logros · ${flowers} flores</div></div></div><div class="card"><h2>✨ Mi historia BOOST</h2>${a.length?`<div class="timeline">${a.map(x=>`<div class="event"><div class="muted">${esc(x.date)}</div><b>${x.emoji} ${esc(x.title)}</b><div class="mini">${esc(x.desc)}</div></div>`).join('')}</div>`:'<div class="soft">🌱 Tu historia empieza con el primer día que registres.</div>'}<p class="muted">Los logros no se pierden por un día sin registro. La historia se calcula a partir de tus datos.</p></div><div class="card" id="fullgarden" style="display:none"><h2>🌷 Mi jardín</h2><div class="garden-art">${'🪴'.repeat(Math.min(6,plants))} ${'🌻'.repeat(Math.min(6,flowers))}</div><p class="muted">Cada logro desbloquea una planta; cada dos logros, una flor. Las comidas con pequeños cambios saludables también suman.</p></div>`}function showGarden(){$('fullgarden').style.display='block';$('fullgarden').scrollIntoView({behavior:'smooth'})}
function renderAjustes(){return `<div class="card settings-card"><h2>⚙️ Ajustes</h2><p class="muted">Todo simple y ordenado. Tus registros se guardan automáticamente en este navegador. 🌈</p></div><div class="card settings-card"><h2>💾 Mis datos</h2><p class="muted">Guardá una copia para conservar tu historia o pasarla a otro dispositivo.</p><div class="stack">${btn('📥 Guardar copia de seguridad','exportBackup()','primary')}<label class="btn restore-button" for="restoreFile">📤 Restaurar una copia</label><input class="hidden" type="file" id="restoreFile" accept="application/json,.json" onchange="importBackup(this.files[0])"></div><p class="muted">Restaurar reemplaza los registros actuales y siempre pide confirmación.</p></div>`}function addCatalog(){let name=$('c_name').value.trim();if(!name)return alert('Indicá un alimento.');db.catalog.push({id:'food'+Date.now(),name,group:$('c_group').value,meals:Array.from(document.querySelectorAll('.c_meal:checked')).map(x=>x.value),unit:$('c_unit').value,defaultQty:num($('c_qty').value)||100});save();render()}function removeCatalog(i){if(String(db.catalog[i]?.id).startsWith('lanari'))return alert('Las opciones del plan original no se eliminan.');if(!confirm('¿Quitar del catálogo? Las comidas ya registradas se conservan.'))return;db.catalog.splice(i,1);save();render()}function exportBackup(){const blob=new Blob([JSON.stringify({app:'BOOST ME 4.0',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`BOOST_ME_4_BACKUP_${date}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importBackup(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='BOOST ME 4.0'||!obj.data||!Array.isArray(obj.data.measurements)||!obj.data.days||!Array.isArray(obj.data.catalog))throw Error('Archivo incompatible');if(!confirm('¿Restaurar este backup? Reemplazará todos los datos actuales de BOOST ME 4.0.'))return;db=obj.data;save();render();alert('Backup restaurado.')}catch(e){alert('No se pudo restaurar: '+e.message)}}function printReport(){let rows=Object.entries(db.days).filter(([k])=>k>=START).sort((a,b)=>a[0].localeCompare(b[0])),meals=rows.flatMap(([k,d])=>(d.meals||[]).map(m=>({date:k,...m}))),counts={ok:0,minor:0,outside:0};meals.forEach(m=>counts[m.rating]=(counts[m.rating]||0)+1);let html=`<html><head><meta charset="utf-8"><title>BOOST ME 4.0 · Informe</title><style>body{font:14px Arial;max-width:900px;margin:35px auto;color:#19314b}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left}h2{margin-top:30px}.datebox{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#e9f5ff;border-radius:15px;padding:9px 12px;font-weight:900;text-transform:capitalize}.datebox input{max-width:40px;border:0;background:transparent;color:transparent}.datebox input::-webkit-calendar-picker-indicator{opacity:1}.rating-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.rating{border:2px solid #e6edf3;border-radius:16px;background:#f8fafc;padding:9px 3px;position:relative;display:grid;justify-items:center;gap:4px;color:#19314b}.rating span{font-size:29px}.rating b{font-size:12px}.rating small{font-size:10px}.rating.chosen{background:#ddf6ec;border-color:#31ad83}.rating:nth-child(2).chosen{background:#fff0cc;border-color:#e9a92d}.rating:nth-child(3).chosen{background:#ffe5e1;border-color:#e98178}.rating strong{position:absolute;right:5px;top:2px;color:#147b5a}.windowresult{margin-top:12px;background:#f0f6fc;border-radius:16px;text-align:center;padding:14px;display:grid;gap:3px}.windowresult strong{font-size:27px}.windowresult small{color:#607486}.windowresult.green{background:#dff6eb}.windowresult.amber{background:#fff0d8}.guidegroup{background:#f1f8fd;padding:12px;border-radius:14px;margin-top:10px}.guidegroup summary{font-weight:900;cursor:pointer}.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekcell{background:#eaf6fd;border-radius:12px;text-align:center;padding:7px 1px;display:grid;gap:4px}.weekcell span{color:#269f83;font-weight:900}.weekcell small{font-size:11px}@media(max-width:380px){.rating b{font-size:11px}.rating small{font-size:9px}}
</style></head><body><h1>BOOST ME 4.0 · Seguimiento</h1><p>Desde 6/10/2026 · Generado ${new Date().toLocaleDateString('es-AR')}</p><h2>Resumen de comidas</h2><p>😍 ${counts.ok} · 🙂 ${counts.minor} · 🙈 ${counts.outside} · Total ${meals.length}</p><table><tr><th>Fecha</th><th>Comida</th><th>Estado</th><th>Detalle</th></tr>${meals.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.type)}</td><td>${({ok:'😍',minor:'🙂',outside:'🙈'})[m.rating]||'—'}</td><td>${(m.items||[]).map(x=>esc(x.name)+' '+fmt(x.qty)+' '+esc(x.unit)+(x.extra?' (extra)':'')).join(', ')} ${esc(m.note||'')}</td></tr>`).join('')}</table><h2>Mediciones</h2><table><tr><th>Fecha</th>${metrics.map(x=>`<th>${x[1]}</th>`).join('')}</tr>${db.measurements.map(m=>`<tr><td>${esc(m.date)}</td>${metrics.map(([id])=>`<td>${fmt(m[id],2)}</td>`).join('')}</tr>`).join('')}</table><h2>Hábitos diarios</h2><table><tr><th>Fecha</th><th>Movimiento</th><th>Agua</th><th>Sueño</th><th>Ciclo</th></tr>${rows.map(([k,d])=>`<tr><td>${k}</td><td>${d.walk?'Caminata ':''}${d.tennis?'Tenis':''}</td><td>${d.water===undefined?'Sin registro':d.water+' ml'}</td><td>${esc(d.sleep||'Sin registro')}</td><td>${esc((([...db.cycles].sort((a,b)=>a.start.localeCompare(b.start)).filter(c=>c.start<=k).at(-1))||{}).start||'')}</td></tr>`).join('')}</table><p>Valores orientativos. Los días sin registro no representan incumplimiento.</p></body></html>`;let win=window.open('','_blank');if(!win)return alert('Permití ventanas emergentes para imprimir el informe.');win.document.write(html);win.document.close();win.focus();setTimeout(()=>win.print(),300)}render();
</script></body></html>
